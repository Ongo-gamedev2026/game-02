<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오리가 되어서 세상을 구하는 게임 - Stage 1</title>
    <style>
        /* 기본 스타일 초기화 및 화면 중앙 배치 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 10 / 7;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #8bc34a; /* 연두색 잔디 바탕색 */
            cursor: crosshair;
        }

        /* UI 오버레이 (시작 화면, 결과 화면) */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        .hidden {
            display: none !important;
        }

        /* 웅장한 TTACHI 로고 타이틀 스타일 */
        .title-wrapper {
            position: relative;
            margin-bottom: 25px;
        }
        .main-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 12px;
            text-transform: uppercase;
            text-shadow: 6px 6px 0 #000, 12px 12px 0 #444;
            position: relative;
            display: inline-block;
        }
        .title-star {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2.5rem, 6vw, 4rem);
            color: #fff5cc;
            text-shadow: 0 0 25px #ffd700, 0 0 50px #ff9900;
            pointer-events: none;
            opacity: 0.9;
        }
        .sub-title-prompt {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: #e0e0e0;
            letter-spacing: 2px;
            margin-top: 20px;
            animation: pulseText 1.5s infinite ease-in-out;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); color: #ffffff; }
        }

        /* 다크소울 스타일 결과창 연출 */
        .ds-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: bold;
            letter-spacing: 15px;
            opacity: 0;
            animation: dsFadeIn 3s ease-out forwards;
            margin-bottom: 20px;
            text-align: center;
            white-space: nowrap;
        }
        @keyframes dsFadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            30% { opacity: 1; }
            100% { opacity: 1; transform: scale(1); }
        }
        .ds-died {
            color: #990000;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(153, 0, 0, 0.4);
        }
        .ds-cleared {
            color: #e6b800;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(230, 184, 0, 0.4);
        }
        .fade-in-delayed {
            opacity: 0;
            animation: textFadeIn 2s ease-out forwards;
            animation-delay: 2s;
        }
        @keyframes textFadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1000" height="700"></canvas>

    <!-- 1. 시작 화면 (시네마틱 TTACHI 타이틀) -->
    <div id="start-screen" class="overlay-screen">
        <div class="title-wrapper">
            <div class="main-title">TTACHI</div>
            <div class="title-star">✦</div>
        </div>
        <div class="sub-title-prompt">[ 아무 버튼이나 누르거나 클릭해서 시작하기 ]</div>
    </div>

    <!-- 2. 결과 화면 (다크소울 스타일 연출) -->
    <div id="result-screen" class="overlay-screen hidden">
        <div id="result-title" class="ds-title"></div>
        <div id="result-prompt-wrapper" class="fade-in-delayed">
            <div id="result-prompt" class="sub-title-prompt"></div>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. 게임 설정값
// ==========================================
const CONFIG = {
    // 플레이어(오리) 설정
    PLAYER_SPEED: 4.2,
    PLAYER_RADIUS: 20,
    PLAYER_STUN_DURATION: 750,  // 닭/충격파 피격 시 0.75초 기절
    PLAYER_DASH_SPEED: 13.5,    // Shift 대쉬 속도
    PLAYER_DASH_DURATION: 160,  // 대쉬 지속 시간 (0.16초)
    PLAYER_DASH_COOLDOWN: 1000, // 대쉬 쿨타임 (1초)

    // 소(보스) 설정
    COW_MAX_HP: 375,            // 돌멩이 15대 (25 * 15)
    COW_PHASE2_HP: 300,         // 체력 20% 감소 시(80% 이하) 2페이즈 진입
    COW_PHASE3_HP: 187.5,       // 체력 50% 이하 시 3페이즈 진입
    COW_RADIUS: 28,
    COW_WALK_SPEED: 1.6,
    COW_DASH_SPEED: 10.5,
    COW_CHAIN_DASH_MULTIPLIER: 1.8, // 무지성 연쇄 돌진 속도 배율
    COW_PRE_DASH_TIME: 800,     // 돌진 전 덜덜 떠는 시간 (0.8초)
    COW_WALL_STUN_TIME: 1000,   // 바위/벽 충돌 시 기절 시간 (1초)
    COW_END_WAIT_TIME: 250,     // 돌진 정상 종료 시 대기 시간 (0.25초)
    COW_CHICKEN_WAIT_TIME: 1500,// 닭 소환 후 대기 시간 (1.5초)
    COW_P1_COOLDOWN: 2600,      // 1페이즈 패턴 쿨타임
    COW_P2_COOLDOWN: 1400,      // 2/3페이즈 패턴 쿨타임
    COW_NORMAL_BOUNCES: 3,      // 2/3페이즈 일반 돌진 벽 반사 횟수
    COW_CHAIN_MAX_BOUNCES: 8,   // 2/3페이즈 무지성 연쇄 돌진 최대 튕김 횟수
    COW_JUMP_DURATION: 750,     // 3페이즈 점프 체공 시간 (0.75초)
    COW_JUMP_RECOVERY: 1000,    // 점프 착지 후 대기 시간 (1초)
    COW_DUST_DASH_MULTIPLIER: 2,// 먼지 구름 돌진 거리 배율 (2배)
    DUST_CLOUD_DURATION: 2000,  // 모래/먼지 구름 지속 시간 (2초)
    COW_HEAL_DURATION: 2500,    // 자가 회복 기절 시간 (2.5초)
    COW_HEAL_RATIO: 0.05,       // 자가 회복량 (최대 체력의 5%)
    SHOCKWAVE_SPEED: 6.5,       // 충격파 확산 속도
    SHOCKWAVE_MAX_RADIUS: 440,  // 충격파 최대 반경

    // 닭 소환수 설정
    MAX_CHICKENS: 9,
    CHICKEN_RADIUS: 15,
    CHICKEN_SPEED: 2.3,
    RED_CHICKEN_SPEED: 3.1,

    // 투사체 및 아이템 설정
    STONE_DAMAGE: 25,
    STONE_SPEED: 11,
    STONE_RADIUS: 10,
    SLINGSHOT_DAMAGE: 25 / 3,   // 새총 데미지 (짱돌의 1/3)
    SLINGSHOT_COOLDOWN: 500,    // 새총 발사 쿨타임 (0.5초)
    SLINGSHOT_SPEED: 14,
    SLINGSHOT_RADIUS: 6,
    ROPE_SPEED: 17,             // 밧줄 발사 속도
    ROPE_MAX_DIST: 440,         // 밧줄 최대 사거리
    ROPE_ORBIT_DURATION: 3000,  // 밧줄 회전 지속 시간 (3초)
    ROPE_ORBIT_SPEED: 0.08,     // 밧줄 회전 각속도
    ROPE_COOLDOWN: 500,         // 밧줄 재사용 대기시간 (0.5초)
    DROP_STONE_RADIUS: 11,
    PICKUP_RANGE: 38,

    // 연출 설정
    BOSS_INTRO_DURATION: 3000   // 보스 등장 3초 연출
};

// ==========================================
// 2. DOM 요소 및 전역 상태 변수
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('start-screen');
const resultScreen = document.getElementById('result-screen');
const resultTitle = document.getElementById('result-title');
const resultPrompt = document.getElementById('result-prompt');
const resultPromptWrapper = document.getElementById('result-prompt-wrapper');

// 게임 상태: 'START' | 'BOSS_INTRO' | 'PLAYING' | 'GAMEOVER' | 'CLEAR'
let gameState = 'START';
let stateTimer = 0;
let bossIntroStartTime = 0;

// 입력 상태
const keys = {};
const pressedCodes = new Set();
const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

// 엔티티
let player = null;
let cow = null;
let rocks = [];
let playerTrails = [];
let droppedStones = [];
let projectiles = [];
let chickens = [];
let shockwaves = [];
let dustClouds = [];
let droppedRope = null;
let activeRope = null;
let slingshotCooldownEnd = 0;
let ropeCooldownEnd = 0;
let floatingTexts = [];
let inventory = [null, null, null, null];
let selectedSlot = 0;

// ==========================================
// 3. 유틸리티 함수
// ==========================================
function dist(x1, y1, x2, y2) {
    return Math.hypot(x2 - x1, y2 - y1);
}

function spawnFloatingText(x, y, text, color = '#ffffff') {
    floatingTexts.push({
        x,
        y,
        text,
        color,
        alpha: 1,
        vy: -1.4
    });
}

// 바위와의 원형 충돌 밀어내기
function resolveRockCollisions(entity) {
    for (let i = 0; i < rocks.length; i++) {
        const r = rocks[i];
        const dx = entity.x - r.x;
        const dy = entity.y - r.y;
        const d = Math.hypot(dx, dy);
        const minDist = entity.radius + r.radius;
        if (d < minDist && d > 0) {
            const overlap = minDist - d;
            entity.x += (dx / d) * overlap;
            entity.y += (dy / d) * overlap;
        }
    }
}

// 소가 바위에 부딪혔을 때 반사각 방향으로 짱돌 미끄러져 나오기
function spawnReflectedStones(cowEntity, rockEntity, count) {
    const baseAngle = Math.atan2(cowEntity.y - rockEntity.y, cowEntity.x - rockEntity.x);
    for (let i = 0; i < count; i++) {
        const spread = count === 1
            ? (Math.random() - 0.5) * 0.7
            : (i === 0 ? -0.45 : 0.45) + (Math.random() - 0.5) * 0.35;
        const angle = baseAngle + spread;
        const speed = 6.5 + Math.random() * 3.0;
        droppedStones.push({
            x: cowEntity.x,
            y: cowEntity.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: CONFIG.DROP_STONE_RADIUS
        });
    }
}

// 1페이즈 일반 닭 3마리 소환 (최대 9마리 제한)
function summonNormalChickens() {
    for (let i = 0; i < 3; i++) {
        if (chickens.length >= CONFIG.MAX_CHICKENS) break;
        const angle = (Math.PI * 2 / 3) * i + Math.random() * 0.8;
        chickens.push({
            x: cow.x + Math.cos(angle) * 32,
            y: cow.y + Math.sin(angle) * 32,
            vx: Math.cos(angle) * CONFIG.CHICKEN_SPEED,
            vy: Math.sin(angle) * CONFIG.CHICKEN_SPEED,
            radius: CONFIG.CHICKEN_RADIUS,
            isRed: false,
            hopOffset: Math.random() * Math.PI * 2
        });
    }
}

// 2페이즈 빨간 닭 4방향 발사 (90도 간격)
function summonRedChickensBurst(offsetAngle) {
    for (let i = 0; i < 4; i++) {
        if (chickens.length >= CONFIG.MAX_CHICKENS) break;
        const angle = offsetAngle + (Math.PI / 2) * i;
        chickens.push({
            x: cow.x + Math.cos(angle) * 30,
            y: cow.y + Math.sin(angle) * 30,
            vx: Math.cos(angle) * CONFIG.RED_CHICKEN_SPEED,
            vy: Math.sin(angle) * CONFIG.RED_CHICKEN_SPEED,
            radius: CONFIG.CHICKEN_RADIUS,
            isRed: true,
            hopOffset: Math.random() * Math.PI * 2
        });
    }
}

// ==========================================
// 4. 게임 초기화 및 페이즈 전환
// ==========================================
function initGameEntities() {
    // 플레이어 초기화 (Y절편 중앙 하단)
    player = {
        x: canvas.width / 2,
        y: 580,
        radius: CONFIG.PLAYER_RADIUS,
        flip: false,
        isStunned: false,
        stunEndTime: 0,
        isDashing: false,
        dashEndTime: 0,
        dashCooldownEnd: 0,
        dashAngle: 0,
        isOrbiting: false,
        orbitEndTime: 0,
        orbitAngle: 0,
        orbitRadius: 130
    };

    // 보스 소 초기화 (Y절편 중앙 상단)
    cow = {
        x: canvas.width / 2,
        y: 130,
        radius: CONFIG.COW_RADIUS,
        hp: CONFIG.COW_MAX_HP,
        maxHp: CONFIG.COW_MAX_HP,
        phase3Entered: false,
        isPreDashing: false,
        preDashEndTime: 0,
        isDashing: false,
        isChainDashing: false,
        isWallBounceDash: false,
        isDustDashing: false,
        lastDustSpawnTime: 0,
        bouncesLeft: 0,
        dashAngle: 0,
        dashTargetX: 0,
        dashTargetY: 0,
        isJumping: false,
        jumpStartTime: 0,
        jumpHeight: 0,
        isHealing: false,
        healStartTime: 0,
        healLastTime: 0,
        isStunned: false,
        stunEndTime: 0,
        nextPatternTime: Date.now() + 1800,
        redChickenSecondBurstTime: 0
    };

    // 바위(장애물) 살짝 작게 5개를 맵 전역에 넓게 배치
    rocks = [
        { x: 200, y: 180, radius: 24 },
        { x: 800, y: 180, radius: 24 },
        { x: 500, y: 350, radius: 25 },
        { x: 200, y: 520, radius: 24 },
        { x: 800, y: 520, radius: 24 }
    ];
    playerTrails = [];
    droppedStones = [];
    projectiles = [];
    chickens = [];
    shockwaves = [];
    dustClouds = [];
    droppedRope = null;
    activeRope = null;
    slingshotCooldownEnd = 0;
    ropeCooldownEnd = 0;
    floatingTexts = [];
    inventory = [null, null, null, null];
    selectedSlot = 0;
}

function startTransition() {
    startScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    initGameEntities();
    gameState = 'BOSS_INTRO';
    bossIntroStartTime = Date.now();
}

function returnToTitle() {
    resultScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    gameState = 'START';
}

// 3페이즈 돌입 처리: 인벤토리/바위/돌/닭 전부 제거 + 맵에 밧줄 생성
function enterPhase3() {
    if (!cow || cow.phase3Entered) return;
    cow.phase3Entered = true;

    inventory = [null, null, null, null];
    selectedSlot = 0;
    rocks = [];
    droppedStones = [];
    projectiles = [];
    chickens = [];
    dustClouds = [];
    cow.redChickenSecondBurstTime = 0;

    // 맵 중앙 근처(소와 겹치지 않는 위치)에 밧줄 1개 생성
    let ropeX = canvas.width / 2;
    let ropeY = canvas.height / 2;
    if (dist(ropeX, ropeY, cow.x, cow.y) < 120) {
        ropeY = cow.y < canvas.height / 2 ? canvas.height * 0.65 : canvas.height * 0.35;
    }
    droppedRope = {
        x: ropeX,
        y: ropeY,
        radius: 16
    };

    spawnFloatingText(cow.x, cow.y - 45, '3페이즈 돌입!', '#e040fb');
}

// ==========================================
// 5. 아이템 사용 및 대쉬 액션
// ==========================================
function useSelectedItem() {
    const item = inventory[selectedSlot];
    if (!item) return;

    if (item === 'stone') {
        throwStone();
    } else if (item === 'rope') {
        throwRope();
    } else if (item === 'slingshot') {
        shootSlingshot();
    }
}

function throwStone() {
    if (inventory[selectedSlot] !== 'stone') return;
    inventory[selectedSlot] = null;

    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    projectiles.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(angle) * CONFIG.STONE_SPEED,
        vy: Math.sin(angle) * CONFIG.STONE_SPEED,
        radius: CONFIG.STONE_RADIUS,
        damage: CONFIG.STONE_DAMAGE,
        isPellet: false
    });
}

// 3페이즈 밧줄 발사 (비소모성, 마우스 방향)
function throwRope() {
    const now = Date.now();
    if (activeRope || player.isOrbiting || now < ropeCooldownEnd) return;

    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    activeRope = {
        x: player.x,
        y: player.y,
        startX: player.x,
        startY: player.y,
        vx: Math.cos(angle) * CONFIG.ROPE_SPEED,
        vy: Math.sin(angle) * CONFIG.ROPE_SPEED,
        radius: 12
    };
}

// 3페이즈 새총 발사 (비소모성, 0.5초 쿨타임, 짱돌의 1/3 데미지)
function shootSlingshot() {
    const now = Date.now();
    if (now < slingshotCooldownEnd) return;
    slingshotCooldownEnd = now + CONFIG.SLINGSHOT_COOLDOWN;

    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    projectiles.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(angle) * CONFIG.SLINGSHOT_SPEED,
        vy: Math.sin(angle) * CONFIG.SLINGSHOT_SPEED,
        radius: CONFIG.SLINGSHOT_RADIUS,
        damage: CONFIG.SLINGSHOT_DAMAGE,
        isPellet: true
    });
}

// 플레이어(오리) Shift 대쉬 발동
function triggerPlayerDash() {
    const now = Date.now();
    if (!player || player.isStunned || player.isDashing || now < player.dashCooldownEnd) return;

    // 밧줄 회전 중 대쉬 시 회전 해제
    if (player.isOrbiting) {
        player.isOrbiting = false;
        ropeCooldownEnd = now + CONFIG.ROPE_COOLDOWN;
    }

    let moveX = 0;
    let moveY = 0;
    if (keys['w'] || keys['ArrowUp']) moveY -= 1;
    if (keys['s'] || keys['ArrowDown']) moveY += 1;
    if (keys['a'] || keys['ArrowLeft']) moveX -= 1;
    if (keys['d'] || keys['ArrowRight']) moveX += 1;

    if (moveX !== 0 || moveY !== 0) {
        player.dashAngle = Math.atan2(moveY, moveX);
    } else {
        player.dashAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    }

    if (Math.cos(player.dashAngle) < 0) player.flip = true;
    else if (Math.cos(player.dashAngle) > 0) player.flip = false;

    player.isDashing = true;
    player.dashEndTime = now + CONFIG.PLAYER_DASH_DURATION;
    player.dashCooldownEnd = now + CONFIG.PLAYER_DASH_COOLDOWN;
}

// ==========================================
// 6. 입력 이벤트 리스너
// ==========================================
function updateMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    mouse.x = (e.clientX - rect.left) * scaleX;
    mouse.y = (e.clientY - rect.top) * scaleY;
}

canvas.addEventListener('mousemove', updateMousePos);

startScreen.addEventListener('mousedown', () => {
    if (gameState === 'START') startTransition();
});

resultScreen.addEventListener('mousedown', () => {
    if (Date.now() < stateTimer) return;
    if (gameState === 'GAMEOVER') startTransition();
    else if (gameState === 'CLEAR') returnToTitle();
});

canvas.addEventListener('mousedown', (e) => {
    updateMousePos(e);
    if (gameState === 'START') {
        startTransition();
        return;
    }
    if (gameState === 'GAMEOVER' && Date.now() >= stateTimer) {
        startTransition();
        return;
    }
    if (gameState === 'CLEAR' && Date.now() >= stateTimer) {
        returnToTitle();
        return;
    }
    if (gameState === 'PLAYING' && player && !player.isStunned) {
        useSelectedItem();
    }
});

window.addEventListener('wheel', (e) => {
    if (gameState !== 'PLAYING') return;
    if (e.deltaY > 0) selectedSlot = (selectedSlot + 1) % 4;
    else if (e.deltaY < 0) selectedSlot = (selectedSlot + 3) % 4;
});

window.addEventListener('keydown', (e) => {
    pressedCodes.add(e.code);
    keys[e.key.toLowerCase()] = true;
    keys[e.key] = true;

    if (gameState === 'START') {
        startTransition();
        return;
    }
    if (gameState === 'GAMEOVER' && Date.now() >= stateTimer) {
        startTransition();
        return;
    }
    if (gameState === 'CLEAR' && Date.now() >= stateTimer) {
        returnToTitle();
        return;
    }

    if (gameState !== 'PLAYING') return;

    // 개발자 전용 치트키: Left Ctrl + Left Shift + 1 / 2 / 3
    if (pressedCodes.has('ControlLeft') && pressedCodes.has('ShiftLeft')) {
        if (e.code === 'Digit1' || e.code === 'Numpad1') {
            if (cow && cow.hp > 0) {
                cow.hp = CONFIG.COW_MAX_HP;
                cow.phase3Entered = false;
            }
            return;
        }
        if (e.code === 'Digit2' || e.code === 'Numpad2') {
            if (cow && cow.hp > 0) {
                cow.hp = CONFIG.COW_PHASE2_HP;
                cow.phase3Entered = false;
            }
            return;
        }
        if (e.code === 'Digit3' || e.code === 'Numpad3') {
            if (cow && cow.hp > 0) {
                cow.hp = CONFIG.COW_PHASE3_HP;
                enterPhase3();
            }
            return;
        }
    }

    // Shift 대쉬 (치트키 조합 중에는 발동 방지)
    if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !pressedCodes.has('ControlLeft')) {
        triggerPlayerDash();
        return;
    }

    // 인벤토리 슬롯 선택 (1~4)
    if (e.key >= '1' && e.key <= '4') {
        selectedSlot = parseInt(e.key, 10) - 1;
    }
});

window.addEventListener('keyup', (e) => {
    pressedCodes.delete(e.code);
    keys[e.key.toLowerCase()] = false;
    keys[e.key] = false;
});

// ==========================================
// 7. 메인 업데이트 로직
// ==========================================
function update() {
    const now = Date.now();

    // 1) 보스 등장 3초 연출
    if (gameState === 'BOSS_INTRO') {
        if (now - bossIntroStartTime >= CONFIG.BOSS_INTRO_DURATION) {
            gameState = 'PLAYING';
            cow.nextPatternTime = now + 1000;
        }
        return;
    }

    if (gameState !== 'PLAYING') return;

    // 2) 플레이어(오리) 업데이트
    if (player.isStunned) {
        player.isDashing = false;
        player.isOrbiting = false;
        if (now >= player.stunEndTime) {
            player.isStunned = false;
        }
    } else if (player.isOrbiting) {
        // 밧줄로 소를 기준으로 3초 동안 회전
        if (now >= player.orbitEndTime || !cow || cow.hp <= 0) {
            player.isOrbiting = false;
            ropeCooldownEnd = now + CONFIG.ROPE_COOLDOWN;
        } else {
            player.orbitAngle += CONFIG.ROPE_ORBIT_SPEED;
            player.x = cow.x + Math.cos(player.orbitAngle) * player.orbitRadius;
            player.y = cow.y + Math.sin(player.orbitAngle) * player.orbitRadius;

            if (Math.sin(player.orbitAngle) > 0) player.flip = true;
            else player.flip = false;
        }
    } else if (player.isDashing) {
        player.x += Math.cos(player.dashAngle) * CONFIG.PLAYER_DASH_SPEED;
        player.y += Math.sin(player.dashAngle) * CONFIG.PLAYER_DASH_SPEED;
        playerTrails.push({
            x: player.x,
            y: player.y,
            alpha: 0.55
        });
        if (now >= player.dashEndTime) {
            player.isDashing = false;
        }
    } else {
        let moveX = 0;
        let moveY = 0;
        if (keys['w'] || keys['ArrowUp']) moveY -= 1;
        if (keys['s'] || keys['ArrowDown']) moveY += 1;
        if (keys['a'] || keys['ArrowLeft']) moveX -= 1;
        if (keys['d'] || keys['ArrowRight']) moveX += 1;

        if (moveX !== 0 || moveY !== 0) {
            const len = Math.hypot(moveX, moveY);
            moveX /= len;
            moveY /= len;
            player.x += moveX * CONFIG.PLAYER_SPEED;
            player.y += moveY * CONFIG.PLAYER_SPEED;

            if (moveX < 0) player.flip = true;
            else if (moveX > 0) player.flip = false;
        }
    }

    // 대쉬 잔상 페이드 아웃
    for (let i = playerTrails.length - 1; i >= 0; i--) {
        playerTrails[i].alpha -= 0.06;
        if (playerTrails[i].alpha <= 0) {
            playerTrails.splice(i, 1);
        }
    }

    // 플레이어 맵 경계 및 바위 충돌 제한
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
    resolveRockCollisions(player);

    // 바닥에 생성된 밧줄 획득 판정 (밧줄 + 새총 함께 지급)
    if (droppedRope && dist(player.x, player.y, droppedRope.x, droppedRope.y) < CONFIG.PICKUP_RANGE + 6) {
        inventory[0] = 'rope';
        inventory[1] = 'slingshot';
        selectedSlot = 0;
        droppedRope = null;
        spawnFloatingText(player.x, player.y - 30, '밧줄 & 새총 획득!', '#ffd54f');
    }

    // 발사된 밧줄 업데이트
    if (activeRope) {
        activeRope.x += activeRope.vx;
        activeRope.y += activeRope.vy;

        // 소에게 명중 시 소를 기준으로 3초간 회전 시작
        if (cow && cow.hp > 0 && dist(activeRope.x, activeRope.y, cow.x, cow.y) < activeRope.radius + cow.radius) {
            player.isOrbiting = true;
            player.orbitEndTime = now + CONFIG.ROPE_ORBIT_DURATION;
            player.orbitAngle = Math.atan2(player.y - cow.y, player.x - cow.x);
            player.orbitRadius = Math.max(105, Math.min(185, dist(player.x, player.y, cow.x, cow.y)));
            activeRope = null;
            spawnFloatingText(cow.x, cow.y - 35, '밧줄 걸림!', '#ffb74d');
        } else if (
            dist(activeRope.startX, activeRope.startY, activeRope.x, activeRope.y) >= CONFIG.ROPE_MAX_DIST ||
            activeRope.x < 0 || activeRope.x > canvas.width ||
            activeRope.y < 0 || activeRope.y > canvas.height
        ) {
            activeRope = null;
            ropeCooldownEnd = now + CONFIG.ROPE_COOLDOWN;
        }
    }

    // 3) 보스(소) AI 업데이트
    if (cow.hp > 0) {
        // 반피 도달 시 3페이즈 자동 돌입
        if (cow.hp <= CONFIG.COW_PHASE3_HP && !cow.phase3Entered) {
            enterPhase3();
        }

        const isPhase3 = cow.phase3Entered;
        const isPhase2 = !isPhase3 && cow.hp <= CONFIG.COW_PHASE2_HP;

        // 2페이즈 빨간 닭 2차 발사 예약 처리 (3페이즈에서는 실행 안 함)
        if (!isPhase3 && cow.redChickenSecondBurstTime > 0 && now >= cow.redChickenSecondBurstTime) {
            cow.redChickenSecondBurstTime = 0;
            summonRedChickensBurst(Math.PI / 4);
        }

        if (cow.isStunned) {
            // 기절 상태로 스스로 회복 중인 경우 (2.5초 동안 최대 체력의 5% 회복)
            if (cow.isHealing) {
                const dt = Math.max(0, now - cow.healLastTime);
                cow.healLastTime = now;
                const healAmount = (cow.maxHp * CONFIG.COW_HEAL_RATIO) * (dt / CONFIG.COW_HEAL_DURATION);
                cow.hp = Math.min(cow.maxHp, cow.hp + healAmount);
            }

            // 기절 또는 대기 중
            if (now >= cow.stunEndTime) {
                if (cow.isHealing) {
                    cow.isHealing = false;
                    spawnFloatingText(cow.x, cow.y - 40, '+5% 회복!', '#69f0ae');
                }
                cow.isStunned = false;
                const cooldown = (isPhase2 || isPhase3) ? CONFIG.COW_P2_COOLDOWN : CONFIG.COW_P1_COOLDOWN;
                cow.nextPatternTime = now + cooldown;
            }
        } else if (cow.isJumping) {
            // 3페이즈 점프 후 착지 충격파 패턴
            const progress = Math.min(1, (now - cow.jumpStartTime) / CONFIG.COW_JUMP_DURATION);
            cow.jumpHeight = Math.sin(progress * Math.PI) * 125;

            if (progress >= 1) {
                cow.isJumping = false;
                cow.jumpHeight = 0;
                cow.isStunned = true;
                cow.stunEndTime = now + CONFIG.COW_JUMP_RECOVERY;

                shockwaves.push({
                    x: cow.x,
                    y: cow.y,
                    radius: cow.radius,
                    maxRadius: CONFIG.SHOCKWAVE_MAX_RADIUS,
                    hitPlayer: false
                });
                spawnFloatingText(cow.x, cow.y - 35, '쿵!', '#ffab40');
            }
        } else if (cow.isPreDashing) {
            // 돌진 전 락온 (플레이어 위치 추적)
            if (cow.isDustDashing) {
                const dx = player.x - cow.x;
                const dy = player.y - cow.y;
                cow.dashTargetX = Math.max(cow.radius, Math.min(canvas.width - cow.radius, cow.x + dx * CONFIG.COW_DUST_DASH_MULTIPLIER));
                cow.dashTargetY = Math.max(cow.radius, Math.min(canvas.height - cow.radius, cow.y + dy * CONFIG.COW_DUST_DASH_MULTIPLIER));
            } else {
                cow.dashTargetX = player.x;
                cow.dashTargetY = player.y;
            }
            cow.dashAngle = Math.atan2(cow.dashTargetY - cow.y, cow.dashTargetX - cow.x);

            if (now >= cow.preDashEndTime) {
                cow.isPreDashing = false;
                cow.isDashing = true;
                cow.lastDustSpawnTime = 0;
            }
        } else if (cow.isDashing) {
            const currentDashSpeed = cow.isChainDashing
                ? CONFIG.COW_DASH_SPEED * CONFIG.COW_CHAIN_DASH_MULTIPLIER
                : CONFIG.COW_DASH_SPEED;

            cow.x += Math.cos(cow.dashAngle) * currentDashSpeed;
            cow.y += Math.sin(cow.dashAngle) * currentDashSpeed;

            // 먼지 구름 돌진 중 경로 주변에 모래 구름 생성
            if (cow.isDustDashing && now - cow.lastDustSpawnTime >= 45) {
                cow.lastDustSpawnTime = now;
                for (let k = 0; k < 2; k++) {
                    const offsetAngle = Math.random() * Math.PI * 2;
                    const offsetDist = Math.random() * 48;
                    dustClouds.push({
                        x: cow.x + Math.cos(offsetAngle) * offsetDist,
                        y: cow.y + Math.sin(offsetAngle) * offsetDist,
                        radius: 56 + Math.random() * 24,
                        createdAt: now,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: (Math.random() - 0.5) * 0.4,
                        shade: Math.random()
                    });
                }
            }

            // 바위 충돌 체크
            let hitRockIndex = -1;
            for (let i = 0; i < rocks.length; i++) {
                if (dist(cow.x, cow.y, rocks[i].x, rocks[i].y) < cow.radius + rocks[i].radius) {
                    hitRockIndex = i;
                    break;
                }
            }

            if (hitRockIndex !== -1) {
                const hitRock = rocks[hitRockIndex];
                // 바위 바깥으로 위치 보정
                const pushAngle = Math.atan2(cow.y - hitRock.y, cow.x - hitRock.x);
                cow.x = hitRock.x + Math.cos(pushAngle) * (cow.radius + hitRock.radius + 1);
                cow.y = hitRock.y + Math.sin(pushAngle) * (cow.radius + hitRock.radius + 1);

                if (isPhase2) {
                    // 2페이즈: 바위 영구 파괴 + 짱돌 2개 드랍
                    spawnReflectedStones(cow, hitRock, 2);
                    spawnFloatingText(hitRock.x, hitRock.y - 25, '와장창!', '#ffeb3b');
                    rocks.splice(hitRockIndex, 1);
                } else {
                    // 1페이즈: 바위 유지 + 짱돌 1개 드랍
                    spawnReflectedStones(cow, hitRock, 1);
                }

                cow.isDashing = false;
                cow.isChainDashing = false;
                cow.isWallBounceDash = false;
                cow.isDustDashing = false;
                cow.isStunned = true;
                cow.stunEndTime = now + CONFIG.COW_WALL_STUN_TIME;
            } else {
                // 맵 경계 충돌 처리
                let hitWallX = false;
                let hitWallY = false;
                if (cow.x <= cow.radius) {
                    cow.x = cow.radius;
                    hitWallX = true;
                } else if (cow.x >= canvas.width - cow.radius) {
                    cow.x = canvas.width - cow.radius;
                    hitWallX = true;
                }
                if (cow.y <= cow.radius) {
                    cow.y = cow.radius;
                    hitWallY = true;
                } else if (cow.y >= canvas.height - cow.radius) {
                    cow.y = canvas.height - cow.radius;
                    hitWallY = true;
                }

                if (hitWallX || hitWallY) {
                    if (cow.isWallBounceDash && cow.bouncesLeft > 0) {
                        // 반사각 계산
                        let vx = Math.cos(cow.dashAngle);
                        let vy = Math.sin(cow.dashAngle);
                        if (hitWallX) vx = -vx;
                        if (hitWallY) vy = -vy;
                        cow.dashAngle = Math.atan2(vy, vx);
                        cow.bouncesLeft--;
                    } else {
                        if (cow.isDustDashing) {
                            for (let k = 0; k < 5; k++) {
                                const a = (Math.PI * 2 / 5) * k + Math.random() * 0.5;
                                dustClouds.push({
                                    x: cow.x + Math.cos(a) * (25 + Math.random() * 35),
                                    y: cow.y + Math.sin(a) * (25 + Math.random() * 35),
                                    radius: 62 + Math.random() * 22,
                                    createdAt: now,
                                    vx: (Math.random() - 0.5) * 0.4,
                                    vy: (Math.random() - 0.5) * 0.4,
                                    shade: Math.random()
                                });
                            }
                        }
                        cow.isDashing = false;
                        cow.isChainDashing = false;
                        cow.isWallBounceDash = false;
                        cow.isDustDashing = false;
                        cow.isStunned = true;
                        cow.stunEndTime = now + CONFIG.COW_WALL_STUN_TIME;
                    }
                } else if (!cow.isWallBounceDash) {
                    // 1페이즈 일반 돌진 / 먼지 구름 2배 돌진: 목표 위치 도달 시 정지
                    if (dist(cow.x, cow.y, cow.dashTargetX, cow.dashTargetY) <= currentDashSpeed + 4) {
                        cow.x = Math.max(cow.radius, Math.min(canvas.width - cow.radius, cow.dashTargetX));
                        cow.y = Math.max(cow.radius, Math.min(canvas.height - cow.radius, cow.dashTargetY));
                        if (cow.isDustDashing) {
                            for (let k = 0; k < 5; k++) {
                                const a = (Math.PI * 2 / 5) * k + Math.random() * 0.5;
                                dustClouds.push({
                                    x: cow.x + Math.cos(a) * (25 + Math.random() * 35),
                                    y: cow.y + Math.sin(a) * (25 + Math.random() * 35),
                                    radius: 62 + Math.random() * 22,
                                    createdAt: now,
                                    vx: (Math.random() - 0.5) * 0.4,
                                    vy: (Math.random() - 0.5) * 0.4,
                                    shade: Math.random()
                                });
                            }
                        }
                        cow.isDashing = false;
                        cow.isDustDashing = false;
                        cow.isStunned = true;
                        cow.stunEndTime = now + CONFIG.COW_END_WAIT_TIME;
                    }
                }
            }
        } else {
            // 평소 상태: 플레이어 쪽으로 천천히 걸어옴
            const angle = Math.atan2(player.y - cow.y, player.x - cow.x);
            cow.x += Math.cos(angle) * CONFIG.COW_WALK_SPEED;
            cow.y += Math.sin(angle) * CONFIG.COW_WALK_SPEED;
            cow.x = Math.max(cow.radius, Math.min(canvas.width - cow.radius, cow.x));
            cow.y = Math.max(cow.radius, Math.min(canvas.height - cow.radius, cow.y));
            resolveRockCollisions(cow);

            // 패턴 발동 체크
            if (now >= cow.nextPatternTime) {
                if (isPhase3) {
                    // 3페이즈: 벽 반사 돌진(2) : 점프 충격파(2) : 무지성 연쇄 돌진(2) : 먼지 구름 2배 돌진(2) : 자가 회복 기절(1.5)
                    const roll = Math.random() * 9.5;
                    if (roll < 2) {
                        cow.isPreDashing = true;
                        cow.isChainDashing = false;
                        cow.isWallBounceDash = true;
                        cow.isDustDashing = false;
                        cow.bouncesLeft = CONFIG.COW_NORMAL_BOUNCES;
                        cow.preDashEndTime = now + CONFIG.COW_PRE_DASH_TIME;
                    } else if (roll < 4) {
                        cow.isJumping = true;
                        cow.jumpStartTime = now;
                        cow.jumpHeight = 0;
                    } else if (roll < 6) {
                        cow.isPreDashing = true;
                        cow.isChainDashing = true;
                        cow.isWallBounceDash = true;
                        cow.isDustDashing = false;
                        cow.bouncesLeft = CONFIG.COW_CHAIN_MAX_BOUNCES;
                        cow.preDashEndTime = now + CONFIG.COW_PRE_DASH_TIME;
                    } else if (roll < 8) {
                        cow.isPreDashing = true;
                        cow.isChainDashing = false;
                        cow.isWallBounceDash = false;
                        cow.isDustDashing = true;
                        cow.bouncesLeft = 0;
                        cow.preDashEndTime = now + CONFIG.COW_PRE_DASH_TIME;
                    } else {
                        cow.isHealing = true;
                        cow.isStunned = true;
                        cow.healStartTime = now;
                        cow.healLastTime = now;
                        cow.stunEndTime = now + CONFIG.COW_HEAL_DURATION;
                        spawnFloatingText(cow.x, cow.y - 40, '자가 회복 중...', '#69f0ae');
                    }
                } else if (!isPhase2) {
                    // 1페이즈: 일반 돌진 5 : 닭 소환 1
                    const roll = Math.random() * 6;
                    if (roll < 5 || chickens.length >= CONFIG.MAX_CHICKENS) {
                        cow.isPreDashing = true;
                        cow.isChainDashing = false;
                        cow.isWallBounceDash = false;
                        cow.bouncesLeft = 0;
                        cow.preDashEndTime = now + CONFIG.COW_PRE_DASH_TIME;
                    } else {
                        summonNormalChickens();
                        cow.isStunned = true;
                        cow.stunEndTime = now + CONFIG.COW_CHICKEN_WAIT_TIME;
                    }
                } else {
                    // 2페이즈: 벽 반사 돌진 2 : 빨간 닭 1 : 무지성 연쇄 돌진 5
                    const roll = Math.random() * 8;
                    if (roll < 2) {
                        cow.isPreDashing = true;
                        cow.isChainDashing = false;
                        cow.isWallBounceDash = true;
                        cow.bouncesLeft = CONFIG.COW_NORMAL_BOUNCES;
                        cow.preDashEndTime = now + CONFIG.COW_PRE_DASH_TIME;
                    } else if (roll < 3 && chickens.length < CONFIG.MAX_CHICKENS) {
                        summonRedChickensBurst(0);
                        cow.redChickenSecondBurstTime = now + 450;
                        cow.isStunned = true;
                        cow.stunEndTime = now + CONFIG.COW_CHICKEN_WAIT_TIME;
                    } else {
                        cow.isPreDashing = true;
                        cow.isChainDashing = true;
                        cow.isWallBounceDash = true;
                        cow.bouncesLeft = CONFIG.COW_CHAIN_MAX_BOUNCES;
                        cow.preDashEndTime = now + CONFIG.COW_PRE_DASH_TIME;
                    }
                }
            }
        }

        // 플레이어와 소 충돌 판정 (소가 기절/점프 중이거나 플레이어가 밧줄 회전 중일 때는 안전)
        if (!cow.isStunned && !cow.isJumping && !player.isOrbiting &&
            dist(player.x, player.y, cow.x, cow.y) < player.radius + cow.radius - 4) {
            triggerGameOver();
            return;
        }
    }

    // 4) 3페이즈 점프 충격파 업데이트
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += CONFIG.SHOCKWAVE_SPEED;

        if (!sw.hitPlayer && !player.isDashing) {
            const d = dist(player.x, player.y, sw.x, sw.y);
            if (Math.abs(d - sw.radius) < player.radius + 10) {
                sw.hitPlayer = true;
                player.isStunned = true;
                player.isOrbiting = false;
                player.stunEndTime = now + CONFIG.PLAYER_STUN_DURATION;
            }
        }

        if (sw.radius >= sw.maxRadius) {
            shockwaves.splice(i, 1);
        }
    }

    // 4-2) 모래/먼지 구름 업데이트 (2초 뒤 소멸)
    for (let i = dustClouds.length - 1; i >= 0; i--) {
        const dc = dustClouds[i];
        dc.x += dc.vx;
        dc.y += dc.vy;
        if (now - dc.createdAt >= CONFIG.DUST_CLOUD_DURATION) {
            dustClouds.splice(i, 1);
        }
    }

    // 5) 통통 튕기는 닭 업데이트
    for (let i = chickens.length - 1; i >= 0; i--) {
        const c = chickens[i];
        c.x += c.vx;
        c.y += c.vy;

        // 벽 반사 (화면 이탈 방지)
        if (c.x <= c.radius) {
            c.x = c.radius;
            c.vx = Math.abs(c.vx);
        } else if (c.x >= canvas.width - c.radius) {
            c.x = canvas.width - c.radius;
            c.vx = -Math.abs(c.vx);
        }
        if (c.y <= c.radius) {
            c.y = c.radius;
            c.vy = Math.abs(c.vy);
        } else if (c.y >= canvas.height - c.radius) {
            c.y = canvas.height - c.radius;
            c.vy = -Math.abs(c.vy);
        }

        // 바위 반사
        for (let rIdx = 0; rIdx < rocks.length; rIdx++) {
            const r = rocks[rIdx];
            const d = dist(c.x, c.y, r.x, r.y);
            if (d < c.radius + r.radius && d > 0) {
                const nx = (c.x - r.x) / d;
                const ny = (c.y - r.y) / d;
                c.x = r.x + nx * (c.radius + r.radius);
                c.y = r.y + ny * (c.radius + r.radius);
                const dot = c.vx * nx + c.vy * ny;
                c.vx -= 2 * dot * nx;
                c.vy -= 2 * dot * ny;
            }
        }

        // 플레이어 충돌 시 0.75초 기절 + 닭 자폭 제거
        if (dist(player.x, player.y, c.x, c.y) < player.radius + c.radius - 2) {
            player.isStunned = true;
            player.isOrbiting = false;
            player.stunEndTime = now + CONFIG.PLAYER_STUN_DURATION;
            chickens.splice(i, 1);
        }
    }

    // 6) 바닥 짱돌 슬라이딩(마찰력) 및 획득 업데이트
    for (let i = droppedStones.length - 1; i >= 0; i--) {
        const s = droppedStones[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vx *= 0.92;
        s.vy *= 0.92;
        if (Math.hypot(s.vx, s.vy) < 0.08) {
            s.vx = 0;
            s.vy = 0;
        }

        // 맵 경계 안에 유지
        if (s.x < s.radius) { s.x = s.radius; s.vx = Math.abs(s.vx) * 0.5; }
        if (s.x > canvas.width - s.radius) { s.x = canvas.width - s.radius; s.vx = -Math.abs(s.vx) * 0.5; }
        if (s.y < s.radius) { s.y = s.radius; s.vy = Math.abs(s.vy) * 0.5; }
        if (s.y > canvas.height - s.radius) { s.y = canvas.height - s.radius; s.vy = -Math.abs(s.vy) * 0.5; }

        // 플레이어 획득 판정
        if (dist(player.x, player.y, s.x, s.y) < CONFIG.PICKUP_RANGE) {
            const emptyIdx = inventory.indexOf(null);
            if (emptyIdx !== -1) {
                inventory[emptyIdx] = 'stone';
                droppedStones.splice(i, 1);
            }
        }
    }

    // 7) 투사체(짱돌, 새총 탄환) 업데이트
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;

        // 화면 밖 이탈 시 제거
        if (p.x < -20 || p.x > canvas.width + 20 || p.y < -20 || p.y > canvas.height + 20) {
            projectiles.splice(i, 1);
            continue;
        }

        // 바위에 막힘
        let hitRock = false;
        for (let rIdx = 0; rIdx < rocks.length; rIdx++) {
            if (dist(p.x, p.y, rocks[rIdx].x, rocks[rIdx].y) < p.radius + rocks[rIdx].radius) {
                hitRock = true;
                break;
            }
        }
        if (hitRock) {
            projectiles.splice(i, 1);
            continue;
        }

        // 닭 피격 체크
        let hitChicken = false;
        for (let cIdx = chickens.length - 1; cIdx >= 0; cIdx--) {
            const c = chickens[cIdx];
            if (dist(p.x, p.y, c.x, c.y) < p.radius + c.radius) {
                spawnFloatingText(c.x, c.y - 20, '떼치!');
                chickens.splice(cIdx, 1);
                hitChicken = true;
                break;
            }
        }
        if (hitChicken) {
            projectiles.splice(i, 1);
            continue;
        }

        // 소 피격 체크
        if (cow.hp > 0 && dist(p.x, p.y, cow.x, cow.y) < p.radius + cow.radius) {
            const dmg = p.damage !== undefined ? p.damage : CONFIG.STONE_DAMAGE;
            cow.hp = Math.max(0, cow.hp - dmg);
            spawnFloatingText(cow.x, cow.y - 30, '떼치!');
            projectiles.splice(i, 1);
            if (cow.hp <= 0) {
                triggerGameClear();
                return;
            }
            continue;
        }
    }

    // 8) 떠오르는 타격 텍스트 업데이트
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.025;
        if (ft.alpha <= 0) {
            floatingTexts.splice(i, 1);
        }
    }
}

// ==========================================
// 8. 메인 렌더링 로직
// ==========================================
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 배경 잔디
    ctx.fillStyle = '#8bc34a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'START') return;

    ctx.save();
    // 보스 등장 3초 동안 화면 강하게 덜덜덜 흔들림
    if (gameState === 'BOSS_INTRO') {
        const shakeX = (Math.random() - 0.5) * 16;
        const shakeY = (Math.random() - 0.5) * 16;
        ctx.translate(shakeX, shakeY);
    }

    // 1) 돌진 경고 직사각형 인디케이터 (소가 덜덜 떨 때 표시)
    if (cow && cow.hp > 0 && cow.isPreDashing) {
        const warnLen = cow.isWallBounceDash
            ? 1200
            : dist(cow.x, cow.y, cow.dashTargetX, cow.dashTargetY);
        ctx.save();
        ctx.translate(cow.x, cow.y);
        ctx.rotate(cow.dashAngle);
        ctx.fillStyle = cow.isDustDashing ? 'rgba(218, 165, 80, 0.35)' : 'rgba(255, 40, 40, 0.28)';
        ctx.fillRect(0, -cow.radius, warnLen, cow.radius * 2);
        ctx.strokeStyle = cow.isDustDashing ? 'rgba(235, 185, 95, 0.85)' : 'rgba(255, 60, 60, 0.75)';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, -cow.radius, warnLen, cow.radius * 2);
        ctx.restore();
    }

    // 2) 바위(장애물) 렌더링
    rocks.forEach(r => {
        ctx.save();
        ctx.translate(r.x, r.y);
        // 바위 외곽
        ctx.fillStyle = '#2e2e2e';
        ctx.beginPath();
        ctx.arc(0, 0, r.radius, 0, Math.PI * 2);
        ctx.fill();
        // 바위 본체
        ctx.fillStyle = '#4a4a4a';
        ctx.beginPath();
        ctx.arc(0, 0, r.radius - 3, 0, Math.PI * 2);
        ctx.fill();
        // 하이라이트
        ctx.fillStyle = '#666666';
        ctx.beginPath();
        ctx.arc(-r.radius * 0.28, -r.radius * 0.25, r.radius * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // 3) 바닥 짱돌 렌더링
    droppedStones.forEach(s => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.strokeStyle = '#fdd835';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(0, 6, s.radius + 4, (s.radius + 4) * 0.55, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#555555';
        ctx.beginPath();
        ctx.arc(0, 0, s.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // 3-2) 3페이즈 바닥 밧줄 아이템 렌더링
    if (droppedRope) {
        ctx.save();
        ctx.translate(droppedRope.x, droppedRope.y);
        const pulse = 1 + Math.sin(Date.now() / 180) * 0.12;
        ctx.scale(pulse, pulse);

        ctx.strokeStyle = '#ffd54f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, droppedRope.radius + 6, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#a1662f';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, 12, 8, -0.3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = '#d7a86e';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 4.5, -0.3, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('밧줄', 0, -24);
        ctx.restore();
    }

    // 3-3) 3페이즈 점프 충격파 렌더링
    shockwaves.forEach(sw => {
        const alpha = Math.max(0, 1 - sw.radius / sw.maxRadius);
        ctx.save();
        ctx.strokeStyle = `rgba(255, 90, 20, ${alpha * 0.9})`;
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = `rgba(255, 220, 80, ${alpha})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    });

    // 4) 통통 튕기는 닭 렌더링
    const timeSec = Date.now() / 120;
    chickens.forEach(c => {
        const hopY = Math.abs(Math.sin(timeSec + c.hopOffset)) * 7;
        ctx.save();
        ctx.translate(c.x, c.y - hopY);

        // 그림자
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.beginPath();
        ctx.ellipse(0, hopY + 12, 11, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 닭 몸통
        ctx.fillStyle = c.isRed ? '#e53935' : '#fff8e1';
        ctx.beginPath();
        ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = c.isRed ? '#8e0000' : '#d7ccc8';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 닭 벼슬
        ctx.fillStyle = c.isRed ? '#ffeb3b' : '#d32f2f';
        ctx.beginPath();
        ctx.arc(-4, -c.radius, 4, 0, Math.PI * 2);
        ctx.arc(2, -c.radius - 1, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // 부리 및 눈
        const dir = c.vx < 0 ? -1 : 1;
        ctx.fillStyle = '#ff9800';
        ctx.beginPath();
        ctx.moveTo(dir * c.radius, -2);
        ctx.lineTo(dir * (c.radius + 7), 2);
        ctx.lineTo(dir * c.radius, 5);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(dir * 6, -3, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // 5) 던진 짱돌 및 새총 탄환(투사체) 렌더링
    projectiles.forEach(p => {
        ctx.fillStyle = p.isPellet ? '#ffd54f' : '#424242';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        if (p.isPellet) {
            ctx.strokeStyle = '#795548';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }
    });

    // 5-2) 발사 중이거나 소에 걸린 밧줄 렌더링
    if (player && (activeRope || (player.isOrbiting && cow && cow.hp > 0))) {
        const endX = activeRope ? activeRope.x : cow.x;
        const endY = activeRope ? activeRope.y : (cow.y - cow.jumpHeight);
        ctx.save();
        ctx.strokeStyle = '#8d5524';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        ctx.strokeStyle = '#d7a86e';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();
        ctx.setLineDash([]);

        if (activeRope) {
            ctx.strokeStyle = '#a1662f';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(activeRope.x, activeRope.y, 10, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();
    }

    // 6) 보스(소) 렌더링
    if (cow && cow.hp > 0) {
        // 점프 시 바닥 그림자 표시
        if (cow.isJumping) {
            const shadowScale = Math.max(0.4, 1 - cow.jumpHeight / 200);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(cow.x, cow.y + 12, cow.radius * shadowScale, cow.radius * 0.55 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.save();
        let shakeX = 0;
        let shakeY = 0;
        if (cow.isPreDashing) {
            shakeX = (Math.random() - 0.5) * 10;
            shakeY = (Math.random() - 0.5) * 10;
        }
        const jumpScale = cow.isJumping ? 1 + (cow.jumpHeight / 300) : 1;
        ctx.translate(cow.x + shakeX, cow.y - cow.jumpHeight + shakeY);
        ctx.scale(jumpScale, jumpScale);

        // 2페이즈/3페이즈 발동 시 오라 효과
        if (cow.isHealing) {
            ctx.fillStyle = 'rgba(105, 240, 174, 0.32)';
            ctx.beginPath();
            ctx.arc(0, 0, 40 + Math.sin(Date.now() / 120) * 5, 0, Math.PI * 2);
            ctx.fill();
        } else if (cow.phase3Entered && !cow.isStunned) {
            ctx.fillStyle = 'rgba(180, 30, 220, 0.28)';
            ctx.beginPath();
            ctx.arc(0, 0, 38 + (Math.random() * 6), 0, Math.PI * 2);
            ctx.fill();
        } else if (cow.hp <= CONFIG.COW_PHASE2_HP && !cow.isStunned) {
            ctx.fillStyle = 'rgba(255, 50, 50, 0.25)';
            ctx.beginPath();
            ctx.arc(0, 0, 35 + (Math.random() * 5), 0, Math.PI * 2);
            ctx.fill();
        }

        // 소 뿔
        ctx.fillStyle = '#e0e0e0';
        ctx.beginPath();
        ctx.moveTo(-18, -14);
        ctx.lineTo(-27, -34);
        ctx.lineTo(-8, -22);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(18, -14);
        ctx.lineTo(27, -34);
        ctx.lineTo(8, -22);
        ctx.closePath();
        ctx.fill();

        // 소 얼굴
        ctx.fillStyle = '#8b4513';
        ctx.beginPath();
        ctx.arc(0, 0, cow.radius, 0, Math.PI * 2);
        ctx.fill();

        // 소 코(주둥이)
        ctx.fillStyle = '#cd853f';
        ctx.beginPath();
        ctx.ellipse(0, 10, 14, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // 소 눈 (기절/대기 중일 때는 회색, 돌진 시 붉은색, 평소 검은색)
        if (cow.isStunned) {
            ctx.fillStyle = '#9e9e9e';
        } else if (cow.isDashing || cow.isPreDashing) {
            ctx.fillStyle = '#ff1744';
        } else {
            ctx.fillStyle = '#000000';
        }
        ctx.beginPath();
        ctx.arc(-10, -5, 4.5, 0, Math.PI * 2);
        ctx.arc(10, -5, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // 자가 회복 진행 게이지 (2.5초)
        if (cow.isHealing) {
            const healProgress = Math.min(1, (Date.now() - cow.healStartTime) / CONFIG.COW_HEAL_DURATION);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.beginPath();
            ctx.roundRect(cow.x - 28, cow.y + cow.radius + 10, 56, 7, 3);
            ctx.fill();
            ctx.fillStyle = '#69f0ae';
            ctx.beginPath();
            ctx.roundRect(cow.x - 27, cow.y + cow.radius + 11, 54 * healProgress, 5, 2);
            ctx.fill();
        }
    }

    // 7) 플레이어 대쉬 잔상 렌더링
    playerTrails.forEach(t => {
        ctx.save();
        ctx.fillStyle = `rgba(255, 235, 59, ${t.alpha})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, player.radius * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // 8) 플레이어(오리) 렌더링
    if (player) {
        ctx.save();
        ctx.translate(player.x, player.y);
        if (player.flip) ctx.scale(-1, 1);

        // 오리 몸통
        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f57f17';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 오리 날개
        ctx.fillStyle = '#fdd835';
        ctx.beginPath();
        ctx.ellipse(-4, 4, 10, 6, -0.2, 0, Math.PI * 2);
        ctx.fill();

        // 오리 부리
        ctx.fillStyle = '#ff6f00';
        ctx.beginPath();
        ctx.ellipse(player.radius - 2, 2, 9, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 오리 눈
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(7, -5, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // 기절 시 머리 위에 회전하는 별 3개
        if (player.isStunned) {
            const starBaseAngle = Date.now() / 160;
            for (let i = 0; i < 3; i++) {
                const a = starBaseAngle + (Math.PI * 2 / 3) * i;
                const sx = player.x + Math.cos(a) * 18;
                const sy = player.y - player.radius - 12 + Math.sin(a) * 6;
                ctx.fillStyle = '#ffeb3b';
                ctx.strokeStyle = '#ff9800';
                ctx.lineWidth = 1;
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('★', sx, sy);
            }
        }

        // 대쉬 쿨타임 표시 바
        const dashRemain = player.dashCooldownEnd - Date.now();
        if (dashRemain > 0) {
            const dashRatio = 1 - Math.min(1, dashRemain / CONFIG.PLAYER_DASH_COOLDOWN);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.beginPath(); ctx.roundRect(player.x - 18, player.y + 24, 36, 5, 2); ctx.fill();
            ctx.fillStyle = '#4fc3f7';
            ctx.beginPath(); ctx.roundRect(player.x - 17, player.y + 25, 34 * dashRatio, 3, 1); ctx.fill();
        }

        // 밧줄 회전 남은 시간 게이지 (3초)
        if (player.isOrbiting) {
            const orbitRemain = Math.max(0, player.orbitEndTime - Date.now());
            const orbitRatio = orbitRemain / CONFIG.ROPE_ORBIT_DURATION;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.beginPath(); ctx.roundRect(player.x - 20, player.y + 32, 40, 6, 2); ctx.fill();
            ctx.fillStyle = '#ffb74d';
            ctx.beginPath(); ctx.roundRect(player.x - 19, player.y + 33, 38 * orbitRatio, 4, 1); ctx.fill();
        }
    }

    // 8-2) 모래/먼지 구름 렌더링 (플레이어와 소 위에 그려서 시야를 완전히 가림)
    const nowDraw = Date.now();
    dustClouds.forEach(dc => {
        const age = nowDraw - dc.createdAt;
        const remain = CONFIG.DUST_CLOUD_DURATION - age;
        const fadeAlpha = remain < 400 ? Math.max(0, remain / 400) : 1;

        ctx.save();
        ctx.globalAlpha = fadeAlpha * 0.96;
        ctx.fillStyle = dc.shade > 0.5 ? '#c8ad7f' : '#b59666';
        ctx.beginPath();
        ctx.arc(dc.x, dc.y, dc.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = dc.shade > 0.5 ? '#d8c096' : '#c6a97b';
        ctx.beginPath();
        ctx.arc(dc.x - dc.radius * 0.25, dc.y - dc.radius * 0.2, dc.radius * 0.65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#9e7f52';
        ctx.beginPath();
        ctx.arc(dc.x + dc.radius * 0.22, dc.y + dc.radius * 0.18, dc.radius * 0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // 9) 떠오르는 텍스트 렌더링
    floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    });

    ctx.restore();

    // 10) HUD (보스 체력바 & 인벤토리)
    drawBossHealthBar();
    drawInventory();
}

function drawBossHealthBar() {
    if (!cow) return;
    const barWidth = 560;
    const barHeight = 24;
    const x = (canvas.width - barWidth) / 2;
    const y = 26;

    let ratio = Math.max(0, cow.hp / cow.maxHp);
    if (gameState === 'BOSS_INTRO') {
        ratio = Math.min(1, (Date.now() - bossIntroStartTime) / CONFIG.BOSS_INTRO_DURATION);
    }

    // 보스 이름 표시
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    const bossLabel = cow.phase3Entered
        ? '강력한 소 [3페이즈]'
        : (cow.hp <= CONFIG.COW_PHASE2_HP ? '강력한 소 [2페이즈]' : '강력한 소');
    ctx.strokeText(bossLabel, canvas.width / 2, y - 7);
    ctx.fillText(bossLabel, canvas.width / 2, y - 7);

    // 체력바 배경
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.beginPath();
    ctx.roundRect(x - 3, y - 3, barWidth + 6, barHeight + 6, 8);
    ctx.fill();

    // 체력 게이지
    ctx.fillStyle = cow.phase3Entered ? '#ab47bc' : '#d32f2f';
    if (ratio > 0) {
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth * ratio, barHeight, 6);
        ctx.fill();
    }
}

function drawInventory() {
    const slotWidth = 58;
    const slotHeight = 58;
    const gap = 10;
    const totalWidth = slotWidth * 4 + gap * 3;
    const startX = (canvas.width - totalWidth) / 2;
    const y = canvas.height - slotHeight - 16;

    for (let i = 0; i < 4; i++) {
        const slotX = startX + i * (slotWidth + gap);
        const isSelected = (i === selectedSlot);

        ctx.fillStyle = 'rgba(20, 20, 20, 0.72)';
        ctx.beginPath();
        ctx.roundRect(slotX, y, slotWidth, slotHeight, 8);
        ctx.fill();

        ctx.strokeStyle = isSelected ? '#ffd54f' : 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = isSelected ? 3.5 : 1.5;
        ctx.stroke();

        // 슬롯 번호
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(String(i + 1), slotX + 6, y + 15);

        if (inventory[i] === 'stone') {
            ctx.fillStyle = '#555555';
            ctx.beginPath();
            ctx.arc(slotX + slotWidth / 2, y + slotHeight / 2, 14, 0, Math.PI * 2);
            ctx.fill();
        } else if (inventory[i] === 'rope') {
            const cx = slotX + slotWidth / 2;
            const cy = y + slotHeight / 2;
            ctx.strokeStyle = '#c68b59';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(cx, cy, 14, 9, -0.3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = '#e6c29f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(cx, cy, 8, 5, -0.3, 0, Math.PI * 2);
            ctx.stroke();
        } else if (inventory[i] === 'slingshot') {
            const cx = slotX + slotWidth / 2;
            const cy = y + slotHeight / 2;
            ctx.strokeStyle = '#a1662f';
            ctx.lineWidth = 4.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx, cy + 16);
            ctx.lineTo(cx, cy + 2);
            ctx.lineTo(cx - 11, cy - 12);
            ctx.moveTo(cx, cy + 2);
            ctx.lineTo(cx + 11, cy - 12);
            ctx.stroke();

            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 11, cy - 12);
            ctx.lineTo(cx + 11, cy - 12);
            ctx.stroke();

            // 새총 0.5초 쿨타임 오버레이
            const slingRemain = slingshotCooldownEnd - Date.now();
            if (slingRemain > 0) {
                const ratio = Math.min(1, slingRemain / CONFIG.SLINGSHOT_COOLDOWN);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                ctx.fillRect(slotX, y + slotHeight * (1 - ratio), slotWidth, slotHeight * ratio);
            }
        }
    }
}

// ==========================================
// 9. 게임 종료 처리
// ==========================================
function triggerGameOver() {
    gameState = 'GAMEOVER';
    stateTimer = Date.now() + 1500;

    resultTitle.className = 'ds-title ds-died';
    resultTitle.textContent = '죽었습니다';
    resultPrompt.textContent = '[ 아무 버튼이나 누르거나 클릭해서 다시 시작하기 ]';

    resultPromptWrapper.classList.remove('fade-in-delayed');
    void resultPromptWrapper.offsetWidth;
    resultPromptWrapper.classList.add('fade-in-delayed');

    resultScreen.classList.remove('hidden');
}

function triggerGameClear() {
    gameState = 'CLEAR';
    stateTimer = Date.now() + 1500;

    resultTitle.className = 'ds-title ds-cleared';
    resultTitle.textContent = '스테이지 클리어';
    resultPrompt.textContent = '[ 아무 버튼이나 누르거나 클릭해서 메인으로 ]';

    resultPromptWrapper.classList.remove('fade-in-delayed');
    void resultPromptWrapper.offsetWidth;
    resultPromptWrapper.classList.add('fade-in-delayed');

    resultScreen.classList.remove('hidden');
}

// ==========================================
// 10. 메인 루프
// ==========================================
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

window.onload = function() {
    gameLoop();
};
</script>
